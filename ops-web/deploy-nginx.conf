server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }

  # --- 内嵌鉴权链: ops-web 直连 ops-service, 无 nginx-gateway auth_request,
  #     在此子请求 iam /verify 校验 JWT 并透传用户/角色头至 ops-service
  #     (HeaderAuthFilter 需要 X-User-Roles, SecurityConfig 要求 OPS_READER/ADMIN)
  location = /_auth_verify {
    internal;
    proxy_pass http://iam-service.qianrenqianmian:8082/api/v1/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  # 前端自动登录(演示会话): /api/v1/auth/login 直通 iam
  location /api/v1/auth/ {
    proxy_pass http://iam-service.qianrenqianmian:8082/api/v1/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Tenant-Id $http_x_tenant_id;
  }

  location /api/v1/ops/ {
    auth_request /_auth_verify;
    auth_request_set $auth_user_id $upstream_http_x_user_id;
    auth_request_set $auth_user_roles $upstream_http_x_user_roles;
    proxy_set_header X-User-Id $auth_user_id;
    proxy_set_header X-User-Roles $auth_user_roles;
    proxy_set_header X-Gateway-Verified "1";

    proxy_pass http://ops-service.qianrenqianmian:8096/api/v1/ops/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
}
