name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # =====================================================================
  # Java / Maven 多模块矩阵: 构建 -> 单测 -> JaCoCo -> Trivy -> (main)推送
  # =====================================================================
  java:
    name: java/${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - platform-common
          - tenant-service
          - iam-service
          - course-service
          - teaching-service
          - ops-service
          - graphql-gateway
          - ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # platform-common 为其余模块的公共依赖, 先装入本地仓库
      - name: Install platform-common
        run: mvn -B -f platform-common/pom.xml install -DskipTests

      - name: Test + JaCoCo (${{ matrix.module }})
        run: |
          mvn -B -f ${{ matrix.module }}/pom.xml \
            verify

      # TCG 铁律: 覆盖率红线门禁 —— platform-common 的 jacoco:check(verify 阶段, LINE >= 70%,
      # excludes 见 pom)不通过即红, 零测试同样红; 其余模块暂仅产出报告不设门禁

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: ${{ matrix.module }}/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Build image
        id: image
        run: |
          if [ -f "${{ matrix.module }}/Dockerfile" ]; then
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.sha }}"
            docker build -t "$IMAGE" "${{ matrix.module }}"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.module }} 缺少 Dockerfile, 跳过镜像构建(需补齐)"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy image scan
        if: steps.image.outputs.built == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image (main only)
        if: steps.image.outputs.built == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push "${{ steps.image.outputs.image }}"

  # =====================================================================
  # Python 矩阵: agent-service / kt-service  安装 -> 单测 -> Trivy -> 推送
  # =====================================================================
  python:
    name: python/${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [agent-service, kt-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.module }}/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          if [ -d "${{ matrix.module }}/tests" ] || ls ${{ matrix.module }}/test_*.py >/dev/null 2>&1; then
            pytest -q ${{ matrix.module }} || pytest -q
          else
            echo "::notice::${{ matrix.module }} 未发现测试, 执行语法编译校验"
            python -m compileall -q ${{ matrix.module }}
          fi

      - name: Build image
        id: image
        run: |
          if [ -f "${{ matrix.module }}/Dockerfile" ]; then
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.sha }}"
            docker build -t "$IMAGE" "${{ matrix.module }}"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.module }} 缺少 Dockerfile, 跳过镜像构建"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trivy image scan
        if: steps.image.outputs.built == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push image (main only)
        if: steps.image.outputs.built == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker push "${{ steps.image.outputs.image }}"

  # =====================================================================
  # 清单校验: kustomize 渲染 + 语法合法性
  # =====================================================================
  manifests:
    name: k8s-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Render overlays
        run: |
          kustomize build k8s/base > /dev/null
          kustomize build k8s/overlays/production > /dev/null
          kustomize build k8s/overlays/regions/region-a > /dev/null
          kustomize build k8s/overlays/regions/region-b > /dev/null
