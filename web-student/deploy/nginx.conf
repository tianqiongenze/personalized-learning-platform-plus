server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /gateway/ { proxy_pass http://graphql-gateway.qianrenqianmian:8097/; }
  # 登录换令牌(演示会话引导): 转发到 iam-service(网关信任边界外的直连登录口)
  location /api/v1/auth/ { proxy_pass http://iam-service.qianrenqianmian:8082/api/v1/auth/; }
  location /agent/ { proxy_pass http://agent-service.qianrenqianmian:8090/; }
}
