server:
  port: 8097
  shutdown: graceful

spring:
  application:
    name: graphql-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis.infra.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}   # 集群内调试: /graphiql
    schema:
      locations: classpath:graphql/**/
    websocket:
      path: /graphql-ws

# 各域服务 REST 基址(K8s 内通过 Service DNS 解析; 本地开发可用 localhost 端口映射)
services:
  tenant: ${SVC_TENANT:http://tenant-service:8081/api/v1}
  iam: ${SVC_IAM:http://iam-service:8082/api/v1}
  course: ${SVC_COURSE:http://course-service:8083/api/v1}
  teaching: ${SVC_TEACHING:http://teaching-service:8084/api/v1}
  kt: ${SVC_KT:http://kt-service:8095}
  ai: ${SVC_AI:http://ai-service:8090/api/v1}
  ops: ${SVC_OPS:http://ops-service:8096/api/v1/ops}

# 域服务 HTTP 调用预算(连接/读取超时, 由 DomainClient 接线)
app:
  http:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      domainCall:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        register-health-indicator: true
        # 4xx 属业务错误, 不计入熔断; 5xx/超时/连接失败才熔断
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
