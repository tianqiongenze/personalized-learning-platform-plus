version: '3.8'

# Personalized Learning Platform Plus - Docker Compose Deployment
# Supports 5000 concurrent users with microservices architecture
# Target Server: 10.167.2.176

services:
  # ==========================================
  # SHARED INFRASTRUCTURE
  # ==========================================
  
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: platform-plus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Kafka Message Queue
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: platform-plus-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/etc/confluent/docker/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ==========================================
  # TENANT SERVICE (Port 8081)
  # ==========================================
  
  tenant-postgres:
    image: postgres:16-alpine
    container_name: tenant-postgres
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TENANT_POSTGRES_PASSWORD:-tenant_pass_2024}
    volumes:
      - tenant_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  tenant-redis:
    image: redis:7-alpine
    container_name: tenant-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - tenant_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  tenant-service:
    build:
      context: ./tenant-service
      dockerfile: Dockerfile
    container_name: tenant-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://tenant-postgres:5432/tenant_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${TENANT_POSTGRES_PASSWORD:-tenant_pass_2024}
      - SPRING_REDIS_HOST=tenant-redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      - LOG_LEVEL=INFO
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      tenant-postgres:
        condition: service_healthy
      tenant-redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - tenant-network
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # IAM SERVICE (Port 8082)
  # ==========================================
  
  iam-postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${IAM_POSTGRES_PASSWORD:-iam_pass_2024}
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  iam-redis:
    image: redis:7-alpine
    container_name: iam-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - iam_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  iam-service:
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    container_name: iam-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://iam-postgres:5432/iam_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${IAM_POSTGRES_PASSWORD:-iam_pass_2024}
      - SPRING_REDIS_HOST=iam-redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
      - LOG_LEVEL=INFO
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      iam-postgres:
        condition: service_healthy
      iam-redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - iam-network
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # COURSE SERVICE (Port 8083)
  # ==========================================
  
  course-postgres:
    image: postgres:16-alpine
    container_name: course-postgres
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COURSE_POSTGRES_PASSWORD:-course_pass_2024}
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d course_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  course-redis:
    image: redis:7-alpine
    container_name: course-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - course_redis_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - course-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    container_name: course-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://course-postgres:5432/course_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${COURSE_POSTGRES_PASSWORD:-course_pass_2024}
      - SPRING_REDIS_HOST=course-redis
      - SPRING_REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      course-postgres:
        condition: service_healthy
      course-redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - course-network
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # TEACHING SERVICE (Port 8084)
  # ==========================================
  
  teaching-postgres:
    image: postgres:16-alpine
    container_name: teaching-postgres
    environment:
      POSTGRES_DB: teaching_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEACHING_POSTGRES_PASSWORD:-teaching_pass_2024}
    volumes:
      - teaching_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teaching_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teaching-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  teaching-redis:
    image: redis:7-alpine
    container_name: teaching-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - teaching_redis_data:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teaching-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  teaching-service:
    build:
      context: ./teaching-service
      dockerfile: Dockerfile
    container_name: teaching-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://teaching-postgres:5432/teaching_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${TEACHING_POSTGRES_PASSWORD:-teaching_pass_2024}
      - SPRING_REDIS_HOST=teaching-redis
      - SPRING_REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      teaching-postgres:
        condition: service_healthy
      teaching-redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - teaching-network
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # API GATEWAY (NGINX) - Ports 80/443
  # ==========================================
  
  nginx-gateway:
    image: nginx:alpine
    container_name: platform-plus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - tenant-service
      - iam-service
      - course-service
      - teaching-service
    networks:
      - tenant-network
      - iam-network
      - course-network
      - teaching-network
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==========================================
  # MONITORING STACK
  # ==========================================
  
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: platform-plus-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - platform-shared
      - tenant-network
      - iam-network
      - course-network
      - teaching-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Grafana
  grafana:
    image: grafana/grafana:10.2.0
    container_name: platform-plus-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.48
    container_name: platform-plus-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
    volumes:
      - jaeger_data:/var/lib/jaeger
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ==========================================
  # LOCUST LOAD TESTING (5000 concurrent users)
  # ==========================================
  
  # Locust Master
  locust-master:
    build:
      context: ./locust
      dockerfile: Dockerfile.master
    container_name: platform-plus-locust-master
    ports:
      - "8089:8089"
    environment:
      - LOCUST_MODE=master
      - TARGET_HOST=http://nginx-gateway
      - LOCUST_USERS=5000
      - LOCUST_SPAWN_RATE=50
    volumes:
      - ./locust:/mnt/locust
      - locust_reports:/mnt/locust/reports
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Locust Workers (4 replicas for distributed load)
  locust-worker-1:
    build:
      context: ./locust
      dockerfile: Dockerfile.worker
    container_name: platform-plus-locust-worker-1
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - TARGET_HOST=http://nginx-gateway
    volumes:
      - ./locust:/mnt/locust
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  locust-worker-2:
    build:
      context: ./locust
      dockerfile: Dockerfile.worker
    container_name: platform-plus-locust-worker-2
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - TARGET_HOST=http://nginx-gateway
    volumes:
      - ./locust:/mnt/locust
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  locust-worker-3:
    build:
      context: ./locust
      dockerfile: Dockerfile.worker
    container_name: platform-plus-locust-worker-3
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - TARGET_HOST=http://nginx-gateway
    volumes:
      - ./locust:/mnt/locust
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  locust-worker-4:
    build:
      context: ./locust
      dockerfile: Dockerfile.worker
    container_name: platform-plus-locust-worker-4
    environment:
      - LOCUST_MODE=worker
      - LOCUST_MASTER_HOST=locust-master
      - TARGET_HOST=http://nginx-gateway
    volumes:
      - ./locust:/mnt/locust
    networks:
      - platform-shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

volumes:
  # Shared infrastructure
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  
  # Tenant service
  tenant_postgres_data:
  tenant_redis_data:
  
  # IAM service
  iam_postgres_data:
  iam_redis_data:
  
  # Course service
  course_postgres_data:
  course_redis_data:
  
  # Teaching service
  teaching_postgres_data:
  teaching_redis_data:
  
  # Monitoring
  prometheus_data:
  grafana_data:
  jaeger_data:
  
  # Locust
  locust_reports:

networks:
  # Shared network for Kafka, monitoring, gateway
  platform-shared:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  
  # Service-specific networks for isolation
  tenant-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  
  iam-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16
  
  course-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16
  
  teaching-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16