# Nginx API Gateway Configuration for Personalized Learning Platform Plus
# Routes traffic to appropriate microservices based on path

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream definitions for each microservice
    upstream tenant_service {
        least_conn;
        server tenant-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream iam_service {
        least_conn;
        server iam-service:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream course_service {
        least_conn;
        server course-service:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream teaching_service {
        least_conn;
        server teaching-service:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ops_service {
        least_conn;
        server ops-service:8096 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Health check endpoint
    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ready {
            access_log off;
            return 200 "ready\n";
            add_header Content-Type text/plain;
        }
    }

    # Main API Gateway Server
    server {
        listen 80;
        listen 443 ssl http2;
        server_name platform.local 10.167.2.176;

        # SSL Configuration (self-signed for LAN, replace with real certs for production)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # ==========================================
        # TENANT SERVICE ROUTES (/api/v1/tenants, /api/v1/users)
        # ==========================================
        location /api/v1/tenants/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://tenant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/v1/users/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://tenant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/credit-transfer/ {
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://tenant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ==========================================
        # IAM SERVICE ROUTES (/api/v1/auth, /api/v1/roles, /api/v1/permissions)
        # ==========================================
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            
            proxy_pass http://iam_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/roles/ {
            limit_req zone=api_limit burst=100 nodelay;
            
            proxy_pass http://iam_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/permissions/ {
            limit_req zone=api_limit burst=100 nodelay;
            
            proxy_pass http://iam_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ==========================================
        # COURSE SERVICE ROUTES (/api/v1/courses, /api/v1/knowledge, /api/v1/resources)
        # ==========================================
        location /api/v1/courses/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://course_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Longer timeout for course operations
            proxy_read_timeout 180s;
        }

        location /api/v1/knowledge/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://course_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/resources/ {
            limit_req zone=upload_limit burst=10 nodelay;
            
            proxy_pass http://course_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Extended timeout for file uploads
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100m;
        }

        # ==========================================
        # TEACHING SERVICE ROUTES (/api/v1/paths, /api/v1/assignments, /api/v1/analytics)
        # ==========================================
        location /api/v1/paths/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://teaching_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/assignments/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://teaching_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/v1/analytics/ {
            limit_req zone=api_limit burst=100 nodelay;
            
            proxy_pass http://teaching_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Longer timeout for analytics queries
            proxy_read_timeout 180s;
        }

        # ==========================================
        # RECOMMENDATION SERVICE ROUTES (via Course Service)
        # ==========================================
        location /api/v1/recommendations/ {
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://course_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ==========================================
        # KNOWLEDGE TRACING ROUTES (via Teaching Service)
        # ==========================================
        location /api/v1/kt/ {
            limit_req zone=api_limit burst=500 nodelay;
            
            proxy_pass http://teaching_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # KT inference needs faster response
            proxy_read_timeout 60s;
        }

        # ==========================================
        # MULTIMODAL ANALYSIS ROUTES (via Teaching Service)
        # ==========================================
        location /api/v1/multimodal/ {
            limit_req zone=upload_limit burst=20 nodelay;
            
            proxy_pass http://teaching_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            # Extended timeout for multimodal processing
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50m;
        }

        # ==========================================
        # ADMIN ROUTES (via IAM Service)
        # ==========================================
        location /api/v1/admin/ {
            limit_req zone=api_limit burst=50 nodelay;
            
            proxy_pass http://iam_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ==========================================
        # OPS SERVICE ROUTES (/api/v1/ops)
        # ==========================================
        location /api/v1/ops/ {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://ops_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ==========================================
        # MONITORING ENDPOINTS (Internal only)
        # ==========================================
        location /metrics {
            allow 10.167.2.0/24;
            allow 172.30.0.0/16;
            deny all;
            
            proxy_pass http://prometheus:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /grafana/ {
            allow 10.167.2.0/24;
            allow 172.30.0.0/16;
            deny all;
            
            proxy_pass http://grafana:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Grafana live updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        location /jaeger/ {
            allow 10.167.2.0/24;
            allow 172.30.0.0/16;
            deny all;
            
            proxy_pass http://jaeger:16686/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # LOCUST UI (Internal only)
        # ==========================================
        location /locust/ {
            allow 10.167.2.0/24;
            allow 172.30.0.0/16;
            deny all;
            
            proxy_pass http://locust-master:8089/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for Locust real-time updates
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # ==========================================
        # DEFAULT: Return 404 for unmatched routes
        # ==========================================
        location / {
            return 404 '{"error": "Not Found", "message": "API endpoint not found"}';
            add_header Content-Type application/json;
        }
    }
}