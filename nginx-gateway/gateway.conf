# Nginx API Gateway Configuration for Personalized Learning Platform Plus
# Routes traffic to appropriate microservices based on path

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # CSV/SDT 教训: resolver 用服务名(kube-dns...svc)本身需 DNS 才能解析 —— 构建/语法
    # 校验环境无集群 DNS 时 nginx -t 直接 emerg, 且启动期 DNS 抖动会放大。用 ClusterIP。
    resolver 10.96.0.10 valid=30s ipv6=off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Upstream definitions for each microservice
    upstream tenant_service {
        least_conn;
        server tenant-service:8081 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream iam_service {
        least_conn;
        server iam-service:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream course_service {
        least_conn;
        server course-service:8083 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream teaching_service {
        least_conn;
        server teaching-service:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ops_service {
        least_conn;
        server ops-service:8096 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # Health check endpoint
    server {
        listen 80 default_server;
        # D-07 修复: 原 server_name localhost 且非 default_server, IP 直访/无匹配 Host
        # 的请求落不到任何 server 块 —— /health 与 /api/v1 全 404。
        # server_name _ + default_server 兜底。
        server_name _;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ready {
            access_log off;
            return 200 "ready\n";
            add_header Content-Type text/plain;
        }
    }

    # Main API Gateway Server
    server {
        listen 80;
        listen 443 ssl http2 default_server;
        # D-07 修复: 加节点 IP 兜底, IP 直访(Host=10.167.2.175)可路由;
        # 无 Host 兜底由上方 default_server 块承接(80), 443 由 default_server 兜底
        server_name platform.local 10.167.2.176 10.167.2.175;

        # D-07 修复(补): NodePort 请求带 Host: 10.167.2.175:30081, 精确匹配本块
        # server_name, 落入主块而非 default_server 健康块 —— 主块必须也提供
        # /health /ready, 否则 e2e 的网关健康探针 404。
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /ready {
            access_log off;
            return 200 "ready\n";
            add_header Content-Type text/plain;
        }

        # D-08 修复: 非 UUID 格式租户头在网关层直接拒绝(400), 防止下游
        # iam TenantId.of(UUID.fromString(...)) 抛 IllegalArgumentException → 500。
        # 合法格式: 8-4-4-4-12 hex; 空/缺失放行(登录等匿名端点不带租户头)
        if ($http_x_tenant_id !~ "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})?$") {
            return 400 '{"error": "Bad Request", "message": "X-Tenant-Id must be a UUID"}';
        }

        # SSL Configuration (self-signed for LAN, replace with real certs for production)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests (headers set at server level; if-block only returns)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ==========================================
        # TENANT SERVICE ROUTES (/api/v1/tenants, /api/v1/users)
        # ==========================================
        location = /api/v1/tenants {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Gateway-Verified "1";
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://tenant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /api/v1/tenants/ {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_roles $upstream_http_x_user_roles;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Roles $auth_user_roles;
            proxy_set_header X-Gateway-Verified "1";
            limit_req zone=api_limit burst=200 nodelay;
            
            proxy_pass http://tenant_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /api/v1/users {
            auth_request /_auth_verify;
