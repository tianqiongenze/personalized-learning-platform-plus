apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: qianrenqianmian
  labels: { app: locust-master, layer: performance-test }
spec:
  replicas: 1
  selector:
    matchLabels: { app: locust-master }
  template:
    metadata:
      labels: { app: locust-master, layer: performance-test }
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.29.1
          command: ["locust"]
          args:
            - "-f"
            - "/shared/locustfile_cluster.py"
            - "--master"
            - "--expect-workers"
            - "6"
            - "-u"
            - "30000"
            - "-r"
            - "500"
            - "-t"
            - "5m"
            - "--headless"
            - "--only-summary"
          env:
            - name: LOCUST_MODE
              value: master
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          ports:
            - containerPort: 5557
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          configMap:
            name: locust-cluster-script
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: qianrenqianmian
  labels: { app: locust-worker, layer: performance-test }
spec:
  replicas: 6
  selector:
    matchLabels: { app: locust-worker }
  template:
    metadata:
      labels: { app: locust-worker, layer: performance-test }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: locust-worker }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: locust
          image: locustio/locust:2.29.1
          command: ["locust"]
          args:
            - "-f"
            - "/shared/locustfile_cluster.py"
            - "--worker"
            - "--master-host"
            - "locust-master"
            - "--master-port"
            - "5557"
          env:
            - name: LOCUST_MODE
              value: worker
          resources:
            requests: { cpu: "2", memory: "2Gi" }
            limits: { cpu: "4", memory: "4Gi" }
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          configMap:
            name: locust-cluster-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-cluster-script
  namespace: qianrenqianmian
data:
  locustfile_cluster.py: |
    print("cluster locustfile placeholder")
