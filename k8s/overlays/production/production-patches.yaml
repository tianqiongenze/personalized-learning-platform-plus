# 生产资源规格 patch(命名空间统一为 qianrenqianmian)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: qianrenqianmian
spec:
  template:
    spec:
      containers:
      - name: tenant-service
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "4Gi"
---
