# Loki 单体(single binary, filesystem) — 补齐 loki-stack 缺失的后端 pod
# 背景: helm loki-stack 只装了 promtail DS, loki 主 pod 缺失, svc 3100 Connection refused
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-single
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels: {app: loki-stack, component: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki-stack, component: backend}
  template:
    metadata:
      labels: {app: loki-stack, component: backend, release: loki-stack}
    spec:
      containers:
        - name: loki
          image: 10.167.2.175:30500/platform/loki:3.4.0-x64
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [{containerPort: 3100, name: http}]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - {name: config, configMap: {name: loki-single}}
        - {name: data, emptyDir: {}}
---
# 复用 svc 名 loki-stack: 原 selector 指向已消失的 pod, 改为对齐新 backend label
# (原 svc 由 helm 管理, 此处覆盖 selector 使 promtail 的 push 与 ops 查询都落到新后端)
apiVersion: v1
kind: Service
metadata:
  name: loki-stack
  namespace: monitoring
spec:
  type: ClusterIP
  ports: [{port: 3100, targetPort: 3100, name: http}]
  selector: {app: loki-stack, component: backend}
