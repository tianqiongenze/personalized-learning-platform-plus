# MetalLB Configuration for LAN Access
# This provides LoadBalancer IP addresses from the LAN pool (10.167.2.200-10.167.2.220)

---
# 1. Install MetalLB (run on Kubernetes cluster)
# kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/v0.13.12/config/manifests/metallb-native.yaml

---
# 2. MetalLB IP Address Pool Configuration
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
  - 10.167.2.200-10.167.2.220
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
  - lan-pool

---
# 3. NGINX Ingress Controller with MetalLB LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
  annotations:
    metallb.universe.tf/address-pool: lan-pool
spec:
  type: LoadBalancer
  loadBalancerIP: 10.167.2.200  # Will be auto-assigned from pool
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller

---
# 4. Ingress Class
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx

---
# 5. Platform Plus Ingress (already defined in k8s/base/ingress.yaml)
# This will get a LoadBalancer IP from MetalLB pool

---
# 6. Alternative: NodePort for direct LAN access (if MetalLB not available)
apiVersion: v1
kind: Service
metadata:
  name: platform-plus-nodeport
  namespace: qianrenqianmian
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP
  selector:
    app: nginx-gateway

---
# 7. DNS Configuration for LAN Access
# Add to /etc/hosts on client machines or configure DNS server:
# 10.167.2.200 platform.local
# 10.167.2.200 api.platform.local
# 10.167.2.200 grafana.platform.local
# 10.167.2.200 locust.platform.local

---
# 8. Firewall Rules (run on Kubernetes nodes)
# Allow traffic from LAN (10.167.2.0/24) to NodePorts
# iptables -A INPUT -s 10.167.2.0/24 -p tcp --dport 30080 -j ACCEPT
# iptables -A INPUT -s 10.167.2.0/24 -p tcp --dport 30443 -j ACCEPT
# iptables -A INPUT -s 10.167.2.0/24 -p tcp --dport 80 -j ACCEPT
# iptables -ALES -A INPUT -s 10.167.2.0/24 -p tcp --dport 443 -j ACCEPT

---
# 9. Verify LAN Access
# From any machine in 10.167.2.0/24:
# curl -k https://platform.local/health
# curl -k https://platform.local/api/v1/tenants
# Open browser: https://platform.local