# =============================================================================
# StorageClass —— 平台持久化存储基线 (K8s 1.28)
# 现有集群使用 rancher local-path(见各 StatefulSet volumeClaimTemplates),
# 此处提供两档并允许 overlay 覆盖 provisioner:
#   platform-ssd       : 有状态/高 IO(CRDB/Pulsar/Milvus/Redis), 生产替换为云盘 CSI
#   platform-standard  : 日志/看板(Prometheus/Grafana/Loki), 可降级为廉价盘
# 生产替换示例(阿里云):
#   provisioner: diskplugin.csi.alibabacloud.com
#   parameters: {type: cloud_essd, fsType: ext4}
# 注意: allowVolumeExpansion 打开以便在线扩容(容量规划见 docs/CAPACITY_100K.md)。
# =============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: platform-ssd
  labels:
    app.kubernetes.io/part-of: personalized-learning-platform-plus
    tier: fast
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: platform-standard
  labels:
    app.kubernetes.io/part-of: personalized-learning-platform-plus
    tier: standard
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
