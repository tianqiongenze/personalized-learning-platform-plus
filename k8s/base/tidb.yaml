---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pd-config
  namespace: infra
  labels:
    app: pd
data:
  start.sh: "#!/bin/sh\nexec /pd-server \\\n  --name=${PD_NAME} \\\n  --client-urls=http://0.0.0.0:2379\
    \ \\\n  --peer-urls=http://0.0.0.0:2380 \\\n  --advertise-client-urls=http://${PD_HOST}.infra.svc.cluster.local:2379\
    \ \\\n  --advertise-peer-urls=http://${PD_HOST}.infra.svc.cluster.local:2380 \\\
    \n  --data-dir=/data \\\n  --initial-cluster=pd-0=http://pd-0.infra.svc.cluster.local:2380,pd-1=http://pd-1.infra.svc.cluster.local:2380,pd-2=http://pd-2.infra.svc.cluster.local:2380\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tikv-config
  namespace: infra
  labels: {}
data:
  tikv.toml: '[rocksdb]

    max-open-files = 256

    [raftdb]

    max-open-files = 256

    [server]

    status-addr = "0.0.0.0:20180"

    [storage.block-cache]

    capacity = "1GB"

    '
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tiflash-config-template
  namespace: infra
  labels: {}
data:
  config.toml.template: '[logger]

    errorlog = "/data/err.log"

    log = "/data/info.log"

    log_level = "info"

    [storage]

    [storage.main]

    dir = ["/data"]

    [raft]

    pd_addr = "pd-0.infra.svc.cluster.local:2379,pd-1.infra.svc.cluster.local:2379,pd-2.infra.svc.cluster.local:2379"

    [proxy]

    addr = "0.0.0.0:3930"

    advertise-addr = "PLACEHOLDER_POD_IP:3930"

    data-dir = "/data/proxy"

    config = "/data/proxy.toml"

    [flash]

    tidb_status_addr = "tidb.infra.svc.cluster.local:10080"

    service_addr = "PLACEHOLDER_POD_IP:3930"

    [flash_proxy]

    '
  proxy.toml: 'log-level = "info"

    log-file = "/data/proxy.log"

    [raft]

    pd_addr = "pd-0.infra.svc.cluster.local:2379,pd-1.infra.svc.cluster.local:2379,pd-2.infra.svc.cluster.local:2379"

    data-dir = "/data/proxy"

    addr = "0.0.0.0:20170"

    advertise-addr = "PLACEHOLDER_POD_IP:20170"

    status-addr = "0.0.0.0:20292"

    advertise-status-addr = "PLACEHOLDER_POD_IP:20292"

    [storage]

    data-dir = "/data/proxy"

    '
