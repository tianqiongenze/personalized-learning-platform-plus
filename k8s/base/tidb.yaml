apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiflash
  namespace: infra
  labels: {}
  annotations:
    plpp.io/origin: live-cluster-2026-10-18 (DGO 回写)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiflash
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-10-19T15:49:53+08:00'
      creationTimestamp: null
      labels:
        app: tiflash
    spec:
      containers:
      - command:
        - /tiflash/tiflash
        - server
        - --config-file=/etc/tiflash/config.toml
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        image: 10.167.2.175:30500/base/pingcap/tiflash:v8.5.8-x86v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 3930
          timeoutSeconds: 1
        name: tiflash
        ports:
        - containerPort: 3930
          protocol: TCP
        - containerPort: 20170
          protocol: TCP
        - containerPort: 20292
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 8Gi
          requests:
            cpu: 500m
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /etc/tiflash
          name: generated-config
      dnsPolicy: ClusterFirst
      initContainers:
      - args:
        - 'import os, re

          ip = os.environ.get("POD_IP", "127.0.0.1")

          tmpl = open("/tmpl/config.toml.template").read()

          out = tmpl.replace("PLACEHOLDER_POD_IP", ip)

          # gen8 (ADR-005 §6): [proxy] bind addr must be 0.0.0.0 so tikv leaders on
          # other nodes can reach the engine; per TiDB v8.5 docs the proxy raft addr
          # MUST live under [flash.proxy] in the main config.toml (not [proxy] and
          # not an external proxy.toml file) - keys: addr/advertise-addr/status-addr.
          out = re.sub(r''(\[proxy\][^\[]*?)addr = "[^"]+:3930"'',
          r''\1addr = "0.0.0.0:3930"'', out, flags=re.S)

          out = out.replace(''config = "/data/proxy.toml"'', ''config = "/etc/tiflash/proxy.toml"'')

          fp = (''\n[flash.proxy]\n''
          ''addr = "0.0.0.0:20170"\n''
          ''advertise-addr = "%s:20170"\n''
          ''status-addr = "0.0.0.0:20292"\n''
          ''advertise-status-addr = "%s:20292"\n''
          ''config = "/etc/tiflash/proxy.toml"\n'') % (ip, ip)

          out = out.rstrip() + "\n" + fp

          open("/gen/config.toml", "w").write(out)

          proxy = (''log-level = "info"\n''
          ''log-file = "/data/proxy.log"\n''
          ''addr = "0.0.0.0:20170"\n''
          ''advertise-addr = "%s:20170"\n''
          ''status-addr = "0.0.0.0:20292"\n''
          ''advertise-status-addr = "%s:20292"\n''
          ''\n[raft]\n''
          ''pd_addr = "pd-0.infra.svc.cluster.local:2379,pd-1.infra.svc.cluster.local:2379,pd-2.infra.svc.cluster.local:2379"\n''
          ''data-dir = "/data/proxy"\n''
          ''\n[storage]\n''
          ''data-dir = "/data/proxy"\n'') % (ip, ip)

