apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-0
  namespace: infra
  labels:
    app: pd
    component: pd
  annotations:
    plpp.io/origin: live-cluster-2026-10-18 (DGO 回写)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pd
      instance: pd-0
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: pd
        component: pd
        instance: pd-0
    spec:
      containers:
      - command:
        - /bin/sh
        - /start.sh
        env:
        - name: PD_NAME
          value: pd-0
        - name: PD_HOST
          value: pd-0
        image: pingcap/pd:v8.5.8-x86v1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 20
          periodSeconds: 30
          successThreshold: 1
          tcpSocket:
            port: 2379
          timeoutSeconds: 1
        name: pd
        ports:
        - containerPort: 2379
          protocol: TCP
        - containerPort: 2380
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /start.sh
          name: start
          subPath: start.sh
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pd-0-data
      - configMap:
          defaultMode: 493
          name: pd-config
        name: start
