# =====================================================================
# PLPP TiDB + TiFlash 集群清单 (k8s/base/tidb.yaml)
# 由 live cluster (infra ns, 2026-10-18) 固化回写 — DGO 铁律
# 版本: v8.5.8 全组件一致 (SVD 铁律: spec image == pod image == runtime)
# 镜像: pingcap/pd,tikv,tidb,tiflash:v8.5.8-x86v1 (节点经 daocloud mirror 拉取)
# 集群形态: pd×3 + tikv×3 + tidb×1 + tiflash×1 (Deployment, 非 TiDB Operator)
# 应用接入: jdbc:mysql://tidb.infra:4000/<db> (NodePort 30210 供集群外验证)
# =====================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: tidb
  namespace: infra
  labels:
    app: tidb
spec:
  type: ClusterIP
  selector:
    app: tidb
  ports:
  - name: mysql
    port: 4000
    protocol: TCP
    targetPort: 4000
  - name: status
    port: 10080
    protocol: TCP
    targetPort: 10080
---
apiVersion: v1
kind: Service
metadata:
  name: tidb-np
  namespace: infra
  labels:
    app: tidb
spec:
  type: NodePort
  selector:
    app: tidb
  ports:
  - name: mysql
    nodePort: 30210
    port: 4000
    protocol: TCP
    targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: tiflash
  namespace: infra
  labels:
    app: tiflash
spec:
  type: ClusterIP
  selector:
    app: tiflash
  ports:
  - name: raft
    port: 20170
    protocol: TCP
    targetPort: 20170
  - name: proxy
    port: 20171
    protocol: TCP
    targetPort: 20171
  - name: status
    port: 20292
    protocol: TCP
    targetPort: 20292
---
apiVersion: v1
kind: Service
metadata:
  name: tikv
  namespace: infra
  labels:
    app: tikv
spec:
  type: ClusterIP
  selector:
    app: tikv
  ports:
  - name: tikv
    port: 20160
    protocol: TCP
    targetPort: 20160
---
