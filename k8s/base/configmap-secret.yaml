apiVersion: v1
data:
  APP_EVENTS_OUTBOX: 'true'
  SPRING_FLYWAY_ENABLED: 'true'
  CRDB_JDBC_HOST_PORT: cockroachdb.infra.svc.cluster.local:26257
  CRDB_SSLMODE: disable
  GRAFANA_URL: http://grafana.monitoring.svc.cluster.local:3000
  # 2026-10-24: litellm "No connected db"(基座故障)→ 直连 ollama-worker OpenAI 兼容端点;
  # litellm 恢复后可切回 http://litellm.ai-platform.svc.cluster.local:4000/v1
  LLM_BASE_URL: http://ollama-worker.ai-platform.svc.cluster.local:11434/v1
  # 2026-10-24 对齐 litellm 实际模型名(/v1/models: qwen2.5:14b, qwen2.5-coder:7b)——
  # 旧名 qwen2.5-7b-instruct 致 chat/embeddings 全 404, 消费端进 DLQ
  LLM_MODEL: qwen2.5:14b
  LLM_FALLBACK_MODELS: qwen2.5-coder:7b,qwen2.5:14b
  LOG_LEVEL: INFO
  LOKI_URL: http://loki-stack.monitoring.svc.cluster.local:3100
  MILVUS_HOST: milvus.infra.svc.cluster.local
  MILVUS_PORT: '19530'
  NEBULA_GRAPH_HOST: nebula-graphd.infra.svc.cluster.local
  # 19669 = graphd HTTP status(/stats 巡检用); 9669 是 gRPC 口, HTTP 打上去报
  # "header parser received no bytes"(实测 2026-10-23)
  NEBULA_GRAPH_PORT: '19669'
  PROMETHEUS_URL: http://prometheus.monitoring.svc.cluster.local:9090
  # 2026-10-24 全服务数据层默认 TiDB(动态切换保留: 改 DATASOURCE_URL+DB_DRIVER+DIALECT 即回 CRDB)
  TIDB_HOST: tidb.infra.svc.cluster.local
  TIDB_PORT: '4000'
  PULSAR_HTTP_URL: http://pulsar-broker.infra.svc.cluster.local:8080
  PULSAR_SERVICE_URL: pulsar://pulsar.infra.svc.cluster.local:6650
  # D-01 fix: redis8-svc.dify-plus(51d, pods 全部 Completed 不可用) → infra 单体 redis(requirepass difyai123456)
  REDIS_HOST: redis.infra.svc.cluster.local
  REDIS_PASSWORD: ${REDIS_PASSWORD:?必须显式注入}
  REDIS_PORT: '6379'
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_PROFILES_ACTIVE: prod
kind: ConfigMap
metadata:
  name: platform-plus-config
  namespace: qianrenqianmian
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-plus-secrets
  namespace: qianrenqianmian
stringData:
  DB_PASSWORD: ''
  DB_USERNAME: root
  GRAFANA_PASSWORD: admin123
  GRAFANA_SA_TOKEN: CHANGE_ME_GRAFANA_SERVICE_ACCOUNT_TOKEN
  JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin123
  POSTGRES_PASSWORD: postgres
  REDIS_PASSWORD: ${REDIS_PASSWORD:?必须显式注入}
  PULSAR_TOKEN: CHANGE_ME_PULSAR_TOKEN
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: infra
stringData:
  DB_PASSWORD: ''
  DB_USERNAME: root
  REDIS_PASSWORD: ${REDIS_PASSWORD:?必须显式注入}
  minio-access-key: minioadmin
  minio-secret-key: minioadmin123
  redis-password: ${REDIS_PASSWORD:?必须显式注入}
type: Opaque
