---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-service
  namespace: qianrenqianmian

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-reader
rules:
- apiGroups:
  - ''
  - apps
  - autoscaling
  resources:
  - pods
  - pods/log
  - deployments
  - horizontalpodautoscalers
  - services
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - get
  - list

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-reader-binding
subjects:
- kind: ServiceAccount
  name: ops-service
  namespace: qianrenqianmian
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-reader

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-service
  namespace: qianrenqianmian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ops-service
  template:
    metadata:
      labels:
        app: ops-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8096'
    spec:
      serviceAccountName: ops-service
      terminationGracePeriodSeconds: 30
      containers:
      - name: ops
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        image: 10.167.2.175:30500/platform/ops-service:11.0.8
        envFrom:
        - configMapRef:
            name: platform-plus-config
        - secretRef:
            name: platform-plus-secrets
        ports:
        - containerPort: 8096
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8096
          initialDelaySeconds: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8096
          initialDelaySeconds: 60

apiVersion: v1
kind: Service
metadata:
  name: ops-service
  namespace: qianrenqianmian
spec:
  selector:
    app: ops-service
  ports:
  - port: 8096

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: qianrenqianmian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: ai
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        image: 10.167.2.175:30500/platform/ai-service:11.0.2
        envFrom:
        - configMapRef:
            name: platform-plus-config
        - secretRef:
            name: platform-plus-secrets
        ports:
        - containerPort: 8085
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 45

apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: qianrenqianmian
spec:
  selector:
    app: ai-service
  ports:
  - port: 8085

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: qianrenqianmian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8090'
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: agent
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        image: 10.167.2.175:30500/platform/agent-service:11.0.0
        env:
        - name: LLM_BASE_URL
          value: http://llm-service.infra.svc.cluster.local:8000/v1
        - name: RERANKER_URL
          value: http://vector-reranker.infra:8090
        - name: COURSE_SERVICE_URL
          value: http://course-service.qianrenqianmian:8083/api/v1
        - name: TEACHING_SERVICE_URL
          value: http://teaching-service.qianrenqianmian:8084/api/v1
        - name: KT_BASE
          value: http://kt-service.infra:8086
        - name: COURSE_BASE
          value: http://course-service:8083/api/v1
        ports:
        - containerPort: 8090
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: '1'
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 20

apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: qianrenqianmian
spec:
  selector:
    app: agent-service
  ports:
  - port: 8090

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-reranker
  namespace: infra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-reranker
  template:
    metadata:
      labels:
        app: vector-reranker
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8090'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: reranker
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        image: 10.167.2.175:30500/platform/vector-reranker:11.0.2
        ports:
        - containerPort: 8090
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5

apiVersion: v1
kind: Service
metadata:
  name: vector-reranker
  namespace: infra
spec:
  selector:
    app: vector-reranker
  ports:
  - port: 8090

