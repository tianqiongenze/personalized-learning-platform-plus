apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: qianrenqianmian
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/api/v1/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: course-service
        lifecycle:
          preStop:
            exec: {command: ["sh", "-c", "sleep 5"]}   # 等 endpoint 摘除传播, 再收 SIGTERM 排空在途请求
        image: 10.167.2.175:30500/platform/course-service:11.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        - name: APP_STORAGE_TYPE
          value: "${APP_STORAGE_TYPE:cockroachdb}"   # ADR-004: cockroachdb(默认)|tidb; 切 tidb 需同步 SPRING_DATASOURCE_URL/DRIVER/HIBERNATE_DIALECT 组
        envFrom:
        - configMapRef:
            name: platform-plus-config
        - secretRef:
            name: platform-plus-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8083
          initialDelaySeconds: 90
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: qianrenqianmian
spec:
  type: NodePort
  selector:
    app: course-service
  ports:
  - port: 8083
    targetPort: 8083
