apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: qianrenqianmian
spec:
  replicas: 3
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/api/v1/actuator/prometheus"
    spec:
      containers:
      - name: course-service
        image: platform/course-service:2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
          value: "true"
        envFrom:
        - configMapRef:
            name: platform-plus-config
        - secretRef:
            name: platform-plus-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /api/v1/actuator/health/readiness
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /api/v1/actuator/health/liveness
            port: 8083
          initialDelaySeconds: 90
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: qianrenqianmian
spec:
  type: NodePort
  selector:
    app: course-service
  ports:
  - port: 8083
    targetPort: 8083
