# =============================================================================
# HPA-100K —— 面向 10 万并发的水平扩缩容(核心服务上限 60)
# 依赖: metrics-server(K8s 1.28, autoscaling/v2)
# 变更: 取代 k8s/base/hpa.yaml 与 hpa-new-services.yaml(二者 namespace 误写为
#       platform-plus, 且上限仅 12~20, 无法承载 10 万并发)。
# 说明:
#   - CPU 目标 65%(较原 70% 提前扩容, 为突发留余量), 内存 80% 兜底。
#   - scaleUp 立即(0s 稳定窗 + 100%/15s), scaleDown 300s 稳定窗防抖动。
#   - ai-service / agent-service 亦由 keda.yaml 以队列驱动扩缩; 二者【二选一】:
#       队列深度敏感 -> 用 KEDA(推荐, 支持缩到 0); CPU 敏感 -> 保留本文件 HPA。
#     启用 KEDA 时请从 base kustomization 中移除 ai/agent 的 HPA(见文件末注释)。
# =============================================================================
# ---------- 核心业务服务(qianrenqianmian) ----------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenant-service-hpa
  namespace: qianrenqianmian
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: tenant-service}
  minReplicas: 4
  maxReplicas: 60
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  - type: Resource
    resource: {name: memory, target: {type: Utilization, averageUtilization: 80}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - {type: Percent, value: 100, periodSeconds: 15}
      - {type: Pods, value: 8, periodSeconds: 15}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - {type: Percent, value: 10, periodSeconds: 60}
---
