# 提示: 若采用 keda.yaml 的队列驱动扩缩(推荐), 请从 base kustomization 的
# resources 中移除 hpa-100k.yaml 后改用如下 patches 仅保留其余 HPA, 或直接
# 在 overlay 中 delete: ai-service-hpa / agent-service-hpa。
