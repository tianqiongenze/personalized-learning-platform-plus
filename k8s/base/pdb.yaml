# ---------- 中间件 / 推理(infra) ----------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kt-service-pdb
  namespace: infra
spec:
  minAvailable: 50%
  selector: {matchLabels: {app: kt-service}}
---
apiVersion: policy/v1
