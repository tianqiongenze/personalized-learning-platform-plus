metadata:
  name: vector-reranker-pdb
  namespace: infra
spec:
  minAvailable: 50%
  selector: {matchLabels: {app: vector-reranker}}
---
# ---------- 中间件(infra): 高可用约束 ----------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: infra
spec:
  minAvailable: 8            # 12 节点(6主6从), 至少保留 8 在线
  selector: {matchLabels: {app: redis-cluster}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pulsar-broker-pdb
  namespace: infra
spec:
  minAvailable: 1
  selector: {matchLabels: {app: pulsar, component: broker}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: milvus-pdb
  namespace: infra
spec:
  minAvailable: 1
  selector: {matchLabels: {app: milvus, component: standalone}}
