# =============================================================================
# PodDisruptionBudget —— 保障滚动升级 / 节点排空 / 缩容时不损失可用性
# 策略: 核心服务 minAvailable 50%(配合 HPA min>=4, 任意时刻至少一半在线);
#       有状态中间件见各自清单(如 cockroachdb-pdb maxUnavailable: 1)。
# 依赖: policy/v1 (K8s 1.28 稳定)。
# =============================================================================
# ---------- 核心业务服务(qianrenqianmian) ----------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tenant-service-pdb
  namespace: qianrenqianmian
spec:
  minAvailable: 50%
  selector: {matchLabels: {app: tenant-service}}
---
