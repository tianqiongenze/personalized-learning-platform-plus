# =============================================================================
# 统一运维监测平台 Ingress(路由总入口, 内网 10.167.2.0/24)
# 路由: / -> ops-web | /api/v1/ops -> ops-service | /sse,/ws -> realtime-gateway
#       /grafana -> grafana(serve_from_sub_path) | /ai -> ai-service
# 管理端限流: nginx 注解 auth-tls? 生产用 limit-rps 注解(标准注解)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ops-ingress
  namespace: qianrenqianmian
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE 长连接
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: ops.platform.local
      http:
        paths:
          - path: /api/v1/ops
            pathType: Prefix
            backend: {service: {name: ops-service, port: {number: 8096}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: ops-web, port: {number: 80}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realtime-ingress
  namespace: qianrenqianmian
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: realtime.platform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: realtime-gateway, port: {number: 8095}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: ops.platform.local
      http:
        paths:
          - path: /grafana(/|$)(.*)
            pathType: ImplementationSpecific
            backend: {service: {name: grafana, port: {number: 3000}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-api-ingress
  namespace: qianrenqianmian
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  rules:
    - host: api.platform.local
      http:
        paths:
          - path: /api/v1/tenants
            pathType: Prefix
            backend: {service: {name: tenant-service, port: {number: 8081}}}
          - path: /api/v1/auth
            pathType: Prefix
            backend: {service: {name: iam-service, port: {number: 8082}}}
          - path: /api/v1/users
            pathType: Prefix
            backend: {service: {name: iam-service, port: {number: 8082}}}
          - path: /api/v1/roles
            pathType: Prefix
            backend: {service: {name: iam-service, port: {number: 8082}}}
          - path: /api/v1/courses
            pathType: Prefix
            backend: {service: {name: course-service, port: {number: 8083}}}
          - path: /api/v1/paths
            pathType: Prefix
            backend: {service: {name: teaching-service, port: {number: 8084}}}
          - path: /api/v1/generation
            pathType: Prefix
            backend: {service: {name: ai-service, port: {number: 8085}}}
