# =============================================================================
# Prometheus 修复版
# 修复项: 1) 原 global: 键重复; 2) 引用了未定义的 prometheus-rules ConfigMap(部署即失败)
#         3) 原 kafka/postgres/redis 静态抓取指向已废弃/已复用的单机组件
# 新增抓取: Pulsar broker/bookie, Milvus, NebulaGraph(graphd/storaged), Redis Cluster exporter,
#           node-exporter, kube-state-metrics, Loki, 四个微服务(注解发现), ops-service
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: monitoring}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  platform-alerts.yml: |
    groups:
      - name: platform-services
        rules:
          - alert: ServiceDown
            expr: up{namespace=~"qianrenqianmian|infra"} == 0
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "服务 {{ $labels.job }} 掉线"
          - alert: HighP95Latency
            expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application)) > 1
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.application }} P95 延迟超过 1s"
          - alert: CircuitBreakerOpen
            expr: resilience4j_circuitbreaker_state{state="open"} > 0
            for: 30s
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.name }} 熔断器已打开"
          - alert: HighJvmMemory
            expr: sum(jvm_memory_used_bytes{area="heap"}) by (application) / sum(jvm_memory_max_bytes{area="heap"}) by (application) > 0.85
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.application }} 堆内存使用率超 85%"
      - name: infra
        rules:
          - alert: PulsarBacklogGrowth
            expr: sum(pulsar_backlog) by (topic) > 10000
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "Pulsar 主题 {{ $labels.topic }} 积压超过 10000 条"
          - alert: RedisClusterStateNotOk
            expr: redis_cluster_state != 1
            for: 1m
            labels: {severity: critical}
            annotations:
              summary: "Redis Cluster 状态异常 ({{ $labels.addr }})"
          - alert: RedisLowHitRatio
            expr: sum(rate(redis_keyspace_hits_total[5m])) by (instance) / (sum(rate(redis_keyspace_hits_total[5m])) by (instance) + sum(rate(redis_keyspace_misses_total[5m])) by (instance)) < 0.6
            for: 15m
            labels: {severity: info}
            annotations:
              summary: "Redis {{ $labels.instance }} 缓存命中率低于 60%"
          - alert: MilvusDown
            expr: up{job="milvus"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: "Milvus 向量数据库不可用"
          - alert: NebulaSlowQueries
            expr: rate(nebula_graphd_slow_query_latency_ms_sum[5m]) / rate(nebula_graphd_slow_query_latency_ms_count[5m]) > 500
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "NebulaGraph 慢查询平均耗时超过 500ms"
      - name: hosts
        rules:
          - alert: NodeHighLoad
            expr: node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
            for: 10m
            labels: {severity: warning}
            annotations:
              summary: "节点 {{ $labels.instance }} 5分钟负载过高"
          - alert: NodeDiskAlmostFull
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.85
            for: 15m
            labels: {severity: warning}
            annotations:
              summary: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超 85%"
          - alert: NodeMemoryPressure
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
            for: 10m
            labels: {severity: critical}
            annotations:
              summary: "节点 {{ $labels.instance }} 内存可用不足 10%"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'platform-plus'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # kubelet 内置 cAdvisor: 容器级 CPU/内存/网络(运维平台容器资源视图数据源)
      - job_name: 'kubernetes-cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?
            replacement: $1:10250
        metrics_path: /metrics/cadvisor

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # ---- 中间件(集群内既有/本次部署) ----
      - job_name: 'pulsar-broker'
        static_configs:
          - targets: ['pulsar-broker-0.pulsar-broker.infra.svc.cluster.local:8080', 'pulsar-broker-1.pulsar-broker.infra.svc.cluster.local:8080']

      - job_name: 'pulsar-bookie'
        static_configs:
          - targets: ['pulsar-bookie-0.pulsar-bookie.infra.svc.cluster.local:8000', 'pulsar-bookie-1.pulsar-bookie.infra.svc.cluster.local:8000']

      - job_name: 'milvus'
        static_configs:
          - targets: ['milvus.infra.svc.cluster.local:9091']

      - job_name: 'nebula-graphd'
        static_configs:
          - targets: ['nebula-graphd.infra.svc.cluster.local:19669']

      - job_name: 'nebula-storaged'
        static_configs:
          - targets: ['nebula-storaged-0.nebula-storaged.infra.svc.cluster.local:19779']

      # Redis Cluster exporter sidecar(6 节点逐 Pod), 既有集群按实际地址调整
      - job_name: 'redis-cluster'
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [infra]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: redis-cluster
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(\d+)
            replacement: $1:$2
            target_label: __address__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.7.2
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus'
          - '--storage.tsdb.retention.time=30d'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--web.enable-lifecycle'
          - '--web.enable-admin-api'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
      - name: rules
        configMap:
          name: prometheus-rules
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus
