apiVersion: v1
data:
  cache-monitor.json: "{\n  \"uid\": \"cache-monitor\",\n  \"title\": \"NebulaGraph 慢查询\",\n  \"tags\": [\n    \"platform-plus\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Redis Cluster 命中率\",\n      \"type\": \"gauge\",\n      \"x\": 0,\n      \"y\": 0,\n      \"w\": 8,\n      \"h\": 6,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"1 - (rate(redis_keyspace_misses_total[5m]) / clamp_min(rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]), 0.001))\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 6\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Redis 各节点内存\"\
    ,\n      \"type\": \"timeseries\",\n      \"x\": 8,\n      \"y\": 0,\n      \"w\": 16,\n      \"h\": 6,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"redis_memory_used_bytes\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 16,\n        \"h\": 6\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Redis OPS\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 6,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"redis_instantaneous_ops_per_sec\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 4,\n\
    \      \"title\": \"L1 Caffeine 命中率\",\n      \"type\": \"timeseries\",\n      \"x\": 12,\n      \"y\": 6,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(caffeine_cache_hits_total[5m])) by (application, cache) / clamp_min(sum(rate(caffeine_cache_requests_total[5m])) by (application, cache), 0.001)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Milvus 可用性\",\n      \"type\": \"stat\",\n      \"x\": 0,\n      \"y\": 14,\n      \"w\": 6,\n      \"h\": 5,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"up{job=\\\"milvus\\\"}\",\n          \"refId\": \"A\"\n     \
    \   }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 14,\n        \"w\": 6,\n        \"h\": 5\n      }\n    },\n    {\n      \"id\": 6,\n      \"title\": \"NebulaGraph 慢查询\",\n      \"type\": \"timeseries\",\n      \"x\": 6,\n      \"y\": 14,\n      \"w\": 18,\n      \"h\": 5,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"rate(nebula_graphd_num_queries_latency_us_sum[5m])\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 6,\n        \"y\": 14,\n        \"w\": 18,\n        \"h\": 5\n      }\n    }\n  ]\n}"
  host-resources.json: "{\n  \"uid\": \"host-resources\",\n  \"title\": \"网络发送\",\n  \"tags\": [\n    \"platform-plus\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"CPU 负载 load1/load5\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 0,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"node_load1\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"node_load5\",\n          \"refId\": \"B\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"内存使用率\",\n      \"type\": \"gauge\",\n      \"x\":\
    \ 12,\n      \"y\": 0,\n      \"w\": 6,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(1 - node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)*100\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"磁盘使用率\",\n      \"type\": \"gauge\",\n      \"x\": 18,\n      \"y\": 0,\n      \"w\": 6,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"(1 - node_filesystem_avail_bytes{fstype!~'tmpfs|overlay',mountpoint='/'}/node_filesystem_size_bytes{fstype!~'tmpfs|overlay',mountpoint='/'}) * 100\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\":\
    \ 18,\n        \"y\": 0,\n        \"w\": 6,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 4,\n      \"title\": \"网络接收\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 8,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"rate(node_network_receive_bytes_total{device!~'lo|veth.*'}[5m])\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 5,\n      \"title\": \"网络发送\",\n      \"type\": \"timeseries\",\n      \"x\": 12,\n      \"y\": 8,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"rate(node_network_transmit_bytes_total{device!~'lo|veth.*'}[5m])\"\
    ,\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 8,\n        \"w\": 12,\n        \"h\": 8\n      }\n    }\n  ]\n}"
  platform-overview.json: "{\n  \"uid\": \"platform-overview\",\n  \"title\": \"5xx 错误率\",\n  \"tags\": [\n    \"platform-plus\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"服务健康 (up)\",\n      \"type\": \"stat\",\n      \"x\": 0,\n      \"y\": 0,\n      \"w\": 8,\n      \"h\": 6,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"up{namespace=\\\"platform-plus\\\"}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 8,\n        \"h\": 6\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"P95 延迟(s)\",\n      \"type\": \"timeseries\",\n      \"x\": 8,\n      \"y\": 0,\n      \"w\": 16,\n      \"h\": 6,\n     \
    \ \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, application))\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 8,\n        \"y\": 0,\n        \"w\": 16,\n        \"h\": 6\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"QPS\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 6,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(http_server_requests_seconds_count[5m])) by (application)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 4,\n     \
    \ \"title\": \"5xx 错误率\",\n      \"type\": \"timeseries\",\n      \"x\": 12,\n      \"y\": 6,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(http_server_requests_seconds_count{status=~\\\"5..\\\"}[5m])) by (application)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 6,\n        \"w\": 12,\n        \"h\": 8\n      }\n    }\n  ]\n}"
  pulsar-monitor.json: "{\n  \"uid\": \"pulsar-monitor\",\n  \"title\": \"Bookie 可写性\",\n  \"tags\": [\n    \"platform-plus\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Topic 消息入速率\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 0,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(pulsar_topic_rate_in[5m])) by (topic)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Topic 消息出速率\",\n      \"type\": \"timeseries\",\n      \"x\": 12,\n      \"y\": 0,\n      \"w\": 12,\n \
