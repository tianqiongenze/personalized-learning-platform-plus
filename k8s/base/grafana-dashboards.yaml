  services-jvm.json: "{\n  \"uid\": \"services-jvm\",\n  \"title\": \"GC 暂停 P99\",\n  \"tags\": [\n    \"platform-plus\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"堆内存使用\",\n      \"type\": \"timeseries\",\n      \"x\": 0,\n      \"y\": 0,\n      \"w\": 12,\n      \"h\": 8,\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(jvm_memory_used_bytes{area=\\\"heap\\\"}) by (application)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 0,\n        \"w\": 12,\n        \"h\": 8\n      }\n    },\n    {\n      \"id\": 2,\n      \"title\": \"JVM 线程数\",\n      \"type\": \"timeseries\",\n      \"x\": 12,\n      \"y\": 0,\n      \"w\": 12,\n\
