# =============================================================================
# External Secrets —— 用外部密钥库(Vault/AWS SM/阿里云 KMS)替换明文 Secret
# 背景: configmap-secret.yaml 中存在明文口令(JWT_SECRET / POSTGRES_PASSWORD /
#       MINIO_SECRET_KEY / REDIS_PASSWORD / GRAFANA_PASSWORD 等), 禁止进入生产。
# 方案(二选一):
#   A. External Secrets Operator(本文件, 推荐): 从 Vault/云密钥库同步为 K8s Secret。
#   B. Sealed Secrets: 用 kubeseal 将 Secret 加密为 SealedSecret 提交到 Git。
# 依赖: 先安装 ESO(external-secrets.io), 并创建对应 SecretStore 后端凭证。
# 启用步骤:
#   1. 部署 ESO Operator。
#   2. 用真实地址替换下方 ClusterSecretStore 的 vault 段(或改用云厂商 provider)。
#   3. 从 k8s/base/kustomization.yaml 中移除 configmap-secret.yaml 的 Secret 部分,
#      或(更稳)保留为占位并把本文件生成的同名 Secret 作为唯一来源(同名冲突时
#      以最后应用者为准, 建议删除明文 Secret 段)。
#   4. kubectl apply -f k8s/base/external-secrets.yaml
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform-vault
spec:
  provider:
    vault:
      server: "https://vault.infra.svc.cluster.local:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "platform-plus"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# ---------- 业务密钥(qianrenqianmian) ----------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-plus-secrets
  namespace: qianrenqianmian
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: platform-plus-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - {secretKey: DB_USERNAME,        remoteRef: {key: platform-plus/db, username: ""}}
    - {secretKey: DB_PASSWORD,        remoteRef: {key: platform-plus/db, property: password}}
    - {secretKey: JWT_SECRET,         remoteRef: {key: platform-plus/jwt, property: secret}}
    - {secretKey: POSTGRES_PASSWORD,  remoteRef: {key: platform-plus/postgres, property: password}}
    - {secretKey: MINIO_ACCESS_KEY,   remoteRef: {key: platform-plus/minio, property: accessKey}}
    - {secretKey: MINIO_SECRET_KEY,   remoteRef: {key: platform-plus/minio, property: secretKey}}
    - {secretKey: REDIS_PASSWORD,     remoteRef: {key: platform-plus/redis, property: password}}
    - {secretKey: GRAFANA_PASSWORD,   remoteRef: {key: platform-plus/grafana, property: adminPassword}}
    - {secretKey: GRAFANA_SA_TOKEN,   remoteRef: {key: platform-plus/grafana, property: saToken}}
    - {secretKey: PULSAR_TOKEN,       remoteRef: {key: platform-plus/pulsar, property: token}}
---
# ---------- 中间件密钥(infra) ----------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-secrets
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: platform-secrets
    creationPolicy: Owner
  data:
    - {secretKey: DB_USERNAME,      remoteRef: {key: platform-plus/db, username: ""}}
    - {secretKey: DB_PASSWORD,      remoteRef: {key: platform-plus/db, property: password}}
    - {secretKey: redis-password,   remoteRef: {key: platform-plus/redis, property: password}}
    - {secretKey: minio-access-key, remoteRef: {key: platform-plus/minio, property: accessKey}}
    - {secretKey: minio-secret-key, remoteRef: {key: platform-plus/minio, property: secretKey}}
---
# ---------- PgBouncer 认证文件(infra) ----------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-auth
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: pgbouncer-auth
    creationPolicy: Owner
  data:
    - {secretKey: userlist.txt, remoteRef: {key: platform-plus/pgbouncer, property: userlist}}
---
# =============================================================================
# 备选: Sealed Secrets(方案 B)
# 用 kubeseal 加密后得到的 SealedSecret 形态示例(占位, 需用集群公钥重新生成):
#   kubeseal --format yaml < secret.yaml > sealedsecret.yaml
