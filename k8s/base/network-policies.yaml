# =============================================================================
# 网络策略 (NetworkPolicy, K8s 1.28 / networking.k8s.io/v1)
# 修复记录:
#   1. 原第 14-15 行存在重复空 `- from:`（tenant-service ingress 首条为空规则），
#      会导致该规则匹配全部来源 —— 已删除空条目。
#   2. 原全部策略命名空间为 `platform-plus`，而业务工作负载实际部署在
#      `qianrenqianmian`（见 namespaces.yaml / tenant-service.yaml），
#      策略因命名空间不匹配而完全失效 —— 已统一纠正为 `qianrenqianmian`。
# 本次新增(最小权限基线):
#   - 三个命名空间的 default-deny-all（默认拒绝 ingress+egress）
#   - 白名单: 集群 DNS / ingress-nginx 入站 / monitoring 抓取 / 业务->infra 中间件出站
# 命名空间约定: 业务=qianrenqianmian 中间件=infra 监控=monitoring
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-service-network-policy
  namespace: qianrenqianmian
spec:
  podSelector:
    matchLabels:
      app: tenant-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: iam-service
    - podSelector:
        matchLabels:
          app: course-service
    - podSelector:
        matchLabels:
          app: teaching-service
    ports:
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: tenant-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: tenant-redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
---
