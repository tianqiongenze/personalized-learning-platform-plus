# =============================================================================
# 监控补齐: node-exporter(主机资源) + kube-state-metrics(集群对象状态) + Loki+Promtail(日志)
# 统一运维监测平台的 "主机负载/内存/硬盘/网络/线程" 与 "实时日志" 均来自本文件。
# 踩坑:
#   1. node-exporter 需 hostPID/hostNetwork + 挂载 /proc /sys /, 否则采集不到真实主机指标。
#   2. Promtail 以 DaemonSet 挂载容器日志目录 /var/log/pods, 通过 kubernetes_sd 发现 Pod 标签。
#   3. Loki 单体模式(3.x): retention 由 compulator/limits 处理, 保留 30 天。
# =============================================================================
# ---------- node-exporter ----------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels: {app: node-exporter}
spec:
  selector:
    matchLabels: {app: node-exporter}
  template:
    metadata:
      labels: {app: node-exporter}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - {operator: Exists}
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.9.1
          args:
            - --path.rootfs=/host/root
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --collector.filesystem.mounts-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
          ports:
            - {containerPort: 9100, hostPort: 9100, name: metrics}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: root, mountPath: /host/root, readOnly: true}
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
      volumes:
        - {name: root, hostPath: {path: /}}
        - {name: proc, hostPath: {path: /proc}}
        - {name: sys, hostPath: {path: /sys}}
---
# ---------- kube-state-metrics ----------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: ["", "apps", "autoscaling", "batch", "networking.k8s.io", "policy"]
    resources:
      - pods
      - pods/status
      - nodes
      - namespaces
      - services
      - endpoints
      - deployments
      - deployments/scale
      - replicasets
      - statefulsets
      - daemonsets
      - horizontalpodautoscalers
      - jobs
      - cronjobs
      - ingresses
      - networkpolicies
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
subjects:
  - {kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app: kube-state-metrics}
spec:
  selector: {app: kube-state-metrics}
  ports:
    - {name: metrics, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: ksm
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          ports:
            - {containerPort: 8080, name: metrics}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
---
# ---------- Loki (单体模式) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore: {store: inmemory}
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      retention_period: 720h      # 30 天
      max_query_series: 5000
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: monitoring
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.3
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - {containerPort: 3100, name: http}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /ready, port: 3100}
            initialDelaySeconds: 15
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], storageClassName: local-path, resources: {requests: {storage: 30Gi}}}
---
# ---------- Promtail (采集容器日志 -> Loki) ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /positions/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: __path__
            replacement: /var/log/pods/*/*/*.log
        # 保留全部容器日志, 由 Loki 端 retention 清理
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: promtail}
  template:
    metadata:
      labels: {app: promtail}
    spec:
      tolerations:
        - {operator: Exists}
      containers:
        - name: promtail
          image: grafana/promtail:3.5.3
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          ports:
            - {containerPort: 9080, name: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: positions, mountPath: /positions}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: containers, mountPath: /var/log/containers, readOnly: true}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: positions
          hostPath: {path: /var/lib/promtail, type: DirectoryOrCreate}
        - name: pods
          hostPath: {path: /var/log/pods}
        - name: containers
          hostPath: {path: /var/log/containers}
